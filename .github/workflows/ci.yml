name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
      storage: ${{ steps.filter.outputs.storage }}
      worker: ${{ steps.filter.outputs.worker }}
      mock-api: ${{ steps.filter.outputs.mock-api }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            npm: &npm
              - package.json
              - package-lock.json
            web:
              - *workflow
              - *npm
              - web/**
              - db/src/**
              - db/migrations/**
              - db/package.json
              - storage/src/**
              - storage/package.json
            db:
              - *workflow
              - *npm
              - db/src/**
              - db/migrations/**
              - db/tests/**
              - db/drizzle.config.ts
              - db/package.json
            storage:
              - *workflow
              - *npm
              - storage/**
            worker:
              - *workflow
              - *npm
              - worker/**
              - db/src/**
              - db/migrations/**
              - db/package.json
            mock-api:
              - *workflow
              - tools/mock-api/**
            android:
              - *workflow
              - android/app/**
              - android/gradle/**
              - android/*.kts
              - android/gradle.properties
              - android/gradlew

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observatorio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/observatorio
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: olm-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -w web
      - name: Build
        run: npm run build -w web
      - name: Migrate
        run: npm run db:migrate
      # The upload route tests PUT real objects. `services:` can't pass MinIO's `server /data` command, so run it here
      # (same image as docker-compose.yml) and create the bucket with the SDK that `npm ci` installed.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && break; sleep 1; done
          node -e 'const {S3Client,CreateBucketCommand}=require("@aws-sdk/client-s3");new S3Client({endpoint:process.env.S3_ENDPOINT,region:process.env.S3_REGION,credentials:{accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY},forcePathStyle:true}).send(new CreateBucketCommand({Bucket:process.env.S3_BUCKET})).then(()=>console.log("bucket ready"))'
      - name: Route tests
        run: npm run test -w web

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observatorio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/observatorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check migrations are consistent
        working-directory: db
        run: npx drizzle-kit check
      - name: Check schema has no ungenerated migrations
        run: |
          npm run db:generate
          git diff --exit-code -- db/migrations
          test -z "$(git status --porcelain -- db/migrations)"
      - name: Migrate
        run: npm run db:migrate
      - name: Rule tests
        run: npm run db:test
      - name: Seed
        run: npm run db:seed

  storage:
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w storage
      - name: Unit tests
        run: npm run storage:test

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observatorio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/observatorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w worker
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - name: Tests (Claude mocked)
        run: npm test -w worker

  mock-api:
    needs: changes
    if: needs.changes.outputs.mock-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests
        run: node --test tools/mock-api/server.test.mjs

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
